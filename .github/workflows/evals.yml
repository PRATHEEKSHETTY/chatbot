name: LLM evals

on:
  pull_request:
    paths:
      - "prompts/**"
      - "docs/**"
      - "app/**"
      - "tests/**"
      - "promptfooconfig.yaml"
      - "provider.py"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - name: Run eval suite (fails below pass-rate threshold)
        run: npx promptfoo@latest eval -c promptfooconfig.yaml -o results/latest.json --no-cache
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROMPTFOO_PASS_RATE_THRESHOLD: "90"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: results/latest.json
